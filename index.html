<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SileoJB</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal-wrapper">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="button close"></span>
                <span class="button minimize"></span>
                <span class="button maximize"></span>
            </div>
            <div class="terminal-title">RootLess Support</div>
        </div>
        <div class="terminal-body">
            <div class="terminal-output">
                <h1>Welcome to SileoJB</h1>
                <p>Kho lưu trữ tinh chỉnh dành cho người dùng Việt Nam.</p>
                <p>Nhập lệnh `help` để bắt đầu.</p>
            </div>
            <div class="terminal-input">
                <span class="prompt">$</span>
                <input type="text" id="commandInput" placeholder="Nhập lệnh..." autofocus>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
